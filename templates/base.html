<!doctype html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kitoblar olami{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Kitoblar olami</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'home' %}">Bosh sahifa</a>
            <a class="nav-link" href="{% url 'book_list' %}">Kitoblar</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'profile' %}">Profil</a>
                {% if user.is_staff or user.role == 'admin' %}<a class="nav-link" href="{% url 'dashboard' %}">Admin paneli</a>{% endif %}
                <a class="nav-link" href="{% url 'logout' %}">Chiqish</a>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Kirish</a>
                <a class="nav-link" href="{% url 'register' %}">Ro‘yxatdan o‘tish</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
