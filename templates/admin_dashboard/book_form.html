{% extends 'base.html' %}{% block title %}Kitob{% endblock %}{% block content %}<h1>{% if book %}Kitobni tahrirlash{% else %}Yangi kitob{% endif %}</h1><form method="post" enctype="multipart/form-data" class="mt-3">{% csrf_token %}<input class="form-control mb-2" name="title" value="{{ book.title|default:'' }}" placeholder="Kitob nomi" required><input class="form-control mb-2" name="author" value="{{ book.author|default:'' }}" placeholder="Muallif" required><textarea class="form-control mb-2" name="description" placeholder="Tavsif" required>{{ book.description|default:'' }}</textarea><input class="form-control mb-2" type="date" name="published_date" value="{{ book.published_date|date:'Y-m-d' }}"><input class="form-control mb-3" type="file" name="cover_image"><button class="btn btn-success">Saqlash</button> <a class="btn btn-secondary" href="{% url 'dashboard_books' %}">Bekor qilish</a></form>{% endblock %}
