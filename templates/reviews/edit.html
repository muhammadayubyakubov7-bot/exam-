{% extends 'base.html' %}
{% block title %}Sharhni tahrirlash{% endblock %}
{% block content %}
<h1>Sharhni tahrirlash</h1>
<form method="post" class="mt-3">
{% csrf_token %}
<select class="form-select mb-2" name="rating">
<option value="5" {% if review.rating == 5 %}selected{% endif %}>5 - A’lo</option>
<option value="4" {% if review.rating == 4 %}selected{% endif %}>4 - Yaxshi</option>
<option value="3" {% if review.rating == 3 %}selected{% endif %}>3 - O‘rtacha</option>
<option value="2" {% if review.rating == 2 %}selected{% endif %}>2 - Yomon</option>
<option value="1" {% if review.rating == 1 %}selected{% endif %}>1 - Juda yomon</option>
</select>
<textarea class="form-control mb-3" name="comment" required>{{ review.comment }}</textarea>
<button class="btn btn-success">Saqlash</button>
<a class="btn btn-secondary" href="{% url 'book_detail' review.book.id %}">Bekor qilish</a>
</form>
{% endblock %}
